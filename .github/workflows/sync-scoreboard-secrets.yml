name: Sync scoreboard VPS secrets

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: everaldojuniorr/scoreboard-jiujitsu
          ref: main
          token: ${{ secrets.SCOREBOARD_DEPLOY_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pynacl
      - name: Copy VPS secrets to scoreboard repo
        env:
          GH_PAT: ${{ secrets.SCOREBOARD_DEPLOY_PAT }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: python scripts/github-sync-vps-secrets.py
